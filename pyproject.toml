[project]
name = "grounded-search"
version = "0.1.0"
description = "Grounded research agent built on Strands Agents."
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
otel = [
    "strands-agents[otel]",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
grounded-search = "grounded_search.cli:main"
grounded-search-eval = "grounded_search.evals.runner:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
